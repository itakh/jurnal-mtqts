<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jurnal MTQTS</title>
<meta name="theme-color" content="#f6f6f4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js?v=38c1ce05"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',function(){navigator.serviceWorker.register('sw.js')})</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1e1b;--ink2:#4a4e48;--ink3:#878b84;--line:#e7e8e4;--line2:#d6d8d2;
  --bg:#f6f6f4;--card:#fff;--soft:#f0f1ee;--acc:#2d5622;--acc2:#24461b;--warn:#a15c07;--bad:#b42318;--good:#2d6a1f;
  --r:12px;--sh:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.ar{font-family:"Scheherazade New",serif;direction:rtl;unicode-bidi:isolate;font-size:1.15em}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.muted{color:var(--ink3)}
.warn{color:var(--warn)}.bad{color:var(--bad)}.good{color:var(--good)}

.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login-card{width:min(400px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:34px 30px}
.login-card .lg{width:58px;height:58px;display:block;margin-bottom:18px}
.login-card h1{margin:0;font-size:22px;letter-spacing:-.3px}
.login-card .sub{color:var(--ink3);margin:4px 0 24px}

.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.f small{color:var(--ink3);font-size:12px;line-height:1.45}
.in{width:100%;border:1px solid var(--line2);background:#fff;border-radius:9px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s;min-height:38px}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(45,86,34,.12)}
.in.ar{font-size:18px;padding:4px 11px}
select.in{appearance:none;-webkit-appearance:none;padding-right:30px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http:%2F%2Fwww.w3.org%2F2000%2Fsvg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23878b84'/></svg>") no-repeat right 11px center}
.in.sm{padding:6px 9px;min-height:32px;font-size:13px}
select.in.sm{padding-right:26px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--acc)}
.chks{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:9px;padding:9px 15px;font-weight:600;cursor:pointer;white-space:nowrap;background:none;text-decoration:none;color:inherit;transition:background .15s,border-color .15s}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--acc);color:#fff}.btn-p:hover{background:var(--acc2)}
.btn-s{background:#fff;border-color:var(--line2)}.btn-s:hover{border-color:var(--ink3)}
.btn-g{color:var(--ink2)}.btn-g:hover{background:var(--soft)}
.btn-d{color:var(--bad);border-color:var(--line2);background:#fff}.btn-d:hover{border-color:var(--bad)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn-w{width:100%;padding:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.shell{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 18px}
.brand img{width:38px;height:38px}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand span{font-size:12px;color:var(--ink3)}
.nav{display:flex;flex-direction:column;gap:1px;flex:1;overflow:auto}
.nav .sec{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink3);padding:16px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-weight:500;cursor:pointer}
.nav a svg{width:18px;height:18px;opacity:.75;flex:none}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--soft);color:var(--ink);font-weight:700}
.nav a.on svg{opacity:1;color:var(--acc)}
.me{display:flex;gap:10px;align-items:center;padding:12px 8px 0;border-top:1px solid var(--line);margin-top:8px}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--ink);display:grid;place-items:center;font-weight:700;flex:none;font-size:13px}
.me b{font-size:13px;display:block;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me span{font-size:11.5px;color:var(--ink3)}
.main{min-width:0}
.top{display:none}
.wrap{max-width:1160px;margin:0 auto;padding:26px 28px 90px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:22px;letter-spacing:-.3px}
.ph p{margin:4px 0 0;color:var(--ink3)}
.ph .act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scrim{display:none}
@media(max-width:960px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:60;transform:translateX(-102%);transition:transform .22s}
  .side.open{transform:none;box-shadow:6px 0 24px rgba(0,0,0,.18)}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:59;opacity:0;pointer-events:none;transition:opacity .22s}
  .scrim.on{opacity:1;pointer-events:auto}
  .top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;background:rgba(246,246,244,.92);backdrop-filter:blur(8px);padding:9px 12px;border-bottom:1px solid var(--line)}
  .top img{width:28px;height:28px}
  .top b{font-size:15px;flex:1}
  .wrap{padding:16px 13px 90px}
  .ph h1{font-size:19px}
}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px}
.card-h p{margin:2px 0 0;color:var(--ink3);font-size:12.5px}
.card-b{padding:4px 16px 16px}
.tw{overflow:auto}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:11.5px;font-weight:700;color:var(--ink3);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:#fafaf8}
.t .sub{display:block;color:var(--ink3);font-size:12.5px}
.t td.n{width:40px;color:var(--ink3);font-variant-numeric:tabular-nums}
.t td.r,.t th.r{text-align:right}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap;margin:1px 3px 1px 0;background:#fff}
.chip.acc{border-color:#b9cbb2;color:var(--acc)}
.chip.warn{border-color:#ecd3ad;color:var(--warn)}
.chip.bad{border-color:#f0c2bd;color:var(--bad)}
.empty{padding:34px 16px;text-align:center;color:var(--ink3)}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:0 16px 12px}
.bar .in{width:auto}
.search{flex:1;min-width:180px}
.seg{display:inline-flex;gap:2px;background:var(--soft);padding:3px;border-radius:9px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:900px){.kpi{grid-template-columns:repeat(2,1fr)}}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-size:22px;letter-spacing:-.4px}
.kpi span{font-size:12.5px;color:var(--ink3)}
.cl{list-style:none;margin:0;padding:0}
.cl li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.cl li:last-child{border-bottom:0}
.cl .ic{width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:12px;font-weight:800;margin-top:1px}
.cl .ic.y{background:#e8f0e4;color:var(--good)}.cl .ic.n{background:#fbeee0;color:var(--warn)}
.cl b{display:block;font-weight:600}
.cl span{color:var(--ink3);font-size:12.5px}
.cl a{margin-left:auto;align-self:center}
.jd{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.jd:last-child{border-bottom:0}
.jd time{font-variant-numeric:tabular-nums;font-weight:700;min-width:96px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.cols>.card{margin-bottom:0}

.ov{position:fixed;inset:0;background:rgba(20,22,19,.42);z-index:80;display:grid;place-items:center;padding:18px;animation:fd .15s}
@keyframes fd{from{opacity:0}}
.md{background:#fff;border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 36px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.md.wide{width:min(860px,100%)}
.md-h{padding:18px 20px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.md-h h3{margin:0;font-size:17px}
.md-h p{margin:3px 0 0;color:var(--ink3);font-size:13px}
.md-b{padding:12px 20px;overflow:auto}
.md-f{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.md-f .kiri{margin-right:auto}
.x{border:0;background:none;cursor:pointer;color:var(--ink3);padding:4px;border-radius:6px;font-size:20px;line-height:1}
.x:hover{background:var(--soft)}
@media(max-width:640px){.ov{place-items:end center;padding:0}.md,.md.wide{width:100%;border-radius:16px 16px 0 0;max-height:92vh}}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 30px);font-weight:500}
.toast.err{background:var(--bad)}
.sticky{position:sticky;bottom:12px;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px 10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.18);margin-top:12px}
.sticky .btn-s{border-color:transparent}
.load{display:grid;place-items:center;min-height:60vh;color:var(--ink3)}
.spin{width:22px;height:22px;border:2.5px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.hari{margin-bottom:14px}
.hari h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.jrow{display:grid;grid-template-columns:86px 86px 1fr 32px;gap:6px;margin-bottom:6px;align-items:center}
.jrow .ust{grid-column:3/4;font-size:12px;color:var(--ink3);margin-top:-4px}
@media(max-width:640px){.jrow{grid-template-columns:74px 74px 1fr 30px}}
.lib{display:grid;grid-template-columns:140px 140px 1fr 32px;gap:6px;margin-bottom:6px}
@media(max-width:640px){.lib{grid-template-columns:1fr 1fr;}.lib .in:nth-child(3){grid-column:1/2}}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pk div{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px}
.pk div b{display:block;font-size:13px}
.pk div.off{color:var(--ink3);background:var(--soft);border-color:transparent}
.note{border-left:3px solid var(--line2);padding:4px 0 4px 12px;color:var(--ink2);margin:6px 0 14px;line-height:1.55}
pre.tsv{background:var(--soft);padding:10px;border-radius:8px;font-size:12px;overflow:auto}
</style>
</head>

function api(action, data) {
  if (!API || API.indexOf('TEMPEL') === 0) return Promise.reject(new Error('Alamat server belum diatur di config.js.'));
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, token: S.token, data: data || {} }) })
    .then(function (r) { return r.json(); })
    .catch(function () { throw new Error('Tidak bisa menghubungi server. Periksa koneksi internet.'); })
    .then(function (j) {
      if (!j.ok) {
        if (j.relogin) { S.token = ''; localStorage.removeItem('jm_token'); setTimeout(tampilLogin, 50); }
        throw new Error(j.error || 'Terjadi kesalahan.');
      }
      return j.data;
    });
}

function toast(m, err) {

  el.className = 'toast' + (err ? ' err' : '');
  el.textContent = m;
  document.body.appendChild(el);
  clearTimeout(tt);
  tt = setTimeout(function () { el.remove(); }, err ? 5200 : 2600);
}

function sibuk(btn, p) {

  var isi = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin" style="width:15px;height:15px;margin:0;border-width:2px"></span>';
  return p.then(function (x) { btn.disabled = false; btn.innerHTML = isi; return x; },
    function (e) { btn.disabled = false; btn.innerHTML = isi; throw e; });
}

function pekanEf(p) {
  if (!p || !p.mulai || !p.selesai) return [];
  var t = function (s) { var a = s.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); };
  var iso = function (d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  var mulai = t(p.mulai), selesai = t(p.selesai), lb = (p.libur || []).map(function (l) { return { a: t(l.mulai), b: t(l.selesai || l.mulai), k: l.ket || '' }; });
  var w = new Date(mulai.getTime()); w.setDate(w.getDate() - ((w.getDay() + 6) % 7));
  var out = [], ke = 0;
  for (; w <= selesai; w.setDate(w.getDate() + 7)) {
    var ak = 0, kt = {};
    for (var i = 0; i < 6; i++) {
      var d = new Date(w.getTime()); d.setDate(d.getDate() + i);
      if (d < mulai || d > selesai) continue;
      var l = lb.filter(function (x) { return d >= x.a && d <= x.b; })[0];
      if (l) { if (l.k) kt[l.k] = 1; } else ak++;
    }
    var e = new Date(w.getTime()); e.setDate(e.getDate() + 6);
    if (ak) ke++;
    out.push({ ke: ak ? ke : 0, mulai: iso(w), selesai: iso(e), hariKBM: ak, efektif: ak > 0, ket: Object.keys(kt).join(', ') });
  }
  return out;
}

      rows.map(function (r) { var t = new Date(r.waktu); return '<tr><td style="white-space:nowrap">' + (isNaN(t) ? esc(r.waktu) : t.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' })) + '</td><td>' + esc(r.user) + '</td><td>' + esc(r.aksi) + '</td><td class="muted">' + esc(r.detail) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  });
};

if (S.token) {
  api('boot').then(function (b) { S.b = b; S.per = b.periodeAktifId || ((b.periode[b.periode.length - 1] || {}).id || ''); mulai(); }, function () { tampilLogin(); });
} else tampilLogin();
</script>
