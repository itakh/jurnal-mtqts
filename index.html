<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jurnal MTQTS</title>
<meta name="theme-color" content="#1f3527">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js?v=0f53e316"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',function(){navigator.serviceWorker.register('sw.js')})</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1d19;--ink2:#474a44;--ink3:#686b64;--line:#ebe8e0;--line2:#dad7cd;
  --bg:#f3f1ea;--card:#fff;--soft:#f3f1ea;--acc:#1f3527;--acc2:#15261b;--warn:#9a5b0b;--bad:#a8291d;--good:#2d5a24;
  --hd:#1f3527;--hd2:#33493a;--hdtx:#c3cbbf;--emas:#c8a75c;--emastx:#8a6a24;--tint:#efe6d0;--tinttx:#6f5319;
  --r:18px;--sh:0 1px 2px rgba(27,29,25,.04);
}
html[data-tema=biru]{--bg:#f1f1ef;--soft:#f1f1ef;--line:#e7e7e3;--line2:#d6d6d1;--acc:#1b2536;--acc2:#121a27;--hd:#1b2536;--hd2:#2e3a4d;--hdtx:#bcc3d0;--emas:#d08a5e;--emastx:#9a4e25;--tint:#f6e5d9;--tinttx:#83421d}
html[data-tema=marun]{--bg:#f5f1eb;--soft:#f5f1eb;--line:#ece6dd;--line2:#ddd5ca;--acc:#4a1e27;--acc2:#36151c;--hd:#4a1e27;--hd2:#5f323b;--hdtx:#dcc6c9;--emas:#d1ad6d;--emastx:#82621f;--tint:#f1e7d3;--tinttx:#6d511a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.ar{font-family:"Scheherazade New",serif;direction:rtl;unicode-bidi:isolate;font-size:1.15em}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.muted{color:var(--ink3)}
.warn{color:var(--warn)}.bad{color:var(--bad)}.good{color:var(--good)}

.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login{background:linear-gradient(var(--hd) 0 38%,var(--bg) 38%)}
.login-card{width:min(400px,100%);background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.12);padding:34px 30px}
.login-card .lg{width:58px;height:58px;display:block;margin-bottom:18px}
.login-card h1{margin:0;font-size:22px;letter-spacing:-.3px}
.login-card .sub{color:var(--ink3);margin:4px 0 24px}

.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.f small{color:var(--ink3);font-size:12px;line-height:1.45}
.in{width:100%;border:1px solid var(--line2);background:#fff;border-radius:11px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s;min-height:38px}
.in:focus{border-color:var(--hd);box-shadow:0 0 0 3px color-mix(in srgb,var(--hd) 14%,transparent)}
.in.ar{font-size:18px;padding:4px 11px}
select.in{appearance:none;-webkit-appearance:none;padding-right:30px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http:%2F%2Fwww.w3.org%2F2000%2Fsvg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23878b84'/></svg>") no-repeat right 11px center}
.in.sm{padding:6px 9px;min-height:32px;font-size:13px}
select.in.sm{padding-right:26px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--acc)}
.chks{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:12px;padding:9px 15px;font-weight:700;cursor:pointer;white-space:nowrap;background:none;text-decoration:none;color:inherit;transition:background .15s,border-color .15s}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--acc);color:#fff}.btn-p:hover{background:var(--acc2)}
.btn-s{background:var(--soft);border-color:transparent}.btn-s:hover{background:var(--line)}
.card-h .btn-s,.md .btn-s{background:var(--soft)}
.btn-g{color:var(--ink2)}.btn-g:hover{background:var(--soft)}
.btn-d{color:var(--bad);border-color:var(--line2);background:#fff}.btn-d:hover{border-color:var(--bad)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn-w{width:100%;padding:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.shell{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{background:var(--hd);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 18px}
.brand img{width:38px;height:38px;background:#fff;border-radius:50%;padding:2px}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand span{font-size:12px;color:var(--hdtx)}
.nav{display:flex;flex-direction:column;gap:1px;flex:1;overflow:auto}
.nav .sec{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--hdtx);opacity:.75;padding:16px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;color:var(--hdtx);text-decoration:none;font-weight:500;cursor:pointer}
.nav a svg{width:18px;height:18px;opacity:.75;flex:none}
.nav a:hover{background:var(--hd2);color:#fff}
.nav a.on{background:var(--hd2);color:#fff;font-weight:700}
.nav a.on svg{opacity:1;color:var(--emas)}
.me{display:flex;gap:10px;align-items:center;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);margin-top:8px}
.me .btn-g{color:var(--hdtx)}.me .btn-g:hover{background:var(--hd2);color:#fff}
.me .av{background:var(--hd2);color:#fff}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--ink);display:grid;place-items:center;font-weight:700;flex:none;font-size:13px}
.me b{font-size:13px;display:block;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me span{font-size:11.5px;color:var(--hdtx)}
.main{min-width:0}
.top{display:none}
.wrap{max-width:1160px;margin:0 auto;padding:26px 28px 90px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px}
.ph p{margin:4px 0 0;color:var(--ink3)}
.ph .act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scrim{display:none}
@media(max-width:960px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:60;transform:translateX(-102%);transition:transform .22s}
  .side.open{transform:none;box-shadow:6px 0 24px rgba(0,0,0,.18)}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:59;opacity:0;pointer-events:none;transition:opacity .22s}
  .scrim.on{opacity:1;pointer-events:auto}
  .top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;background:var(--hd);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
  .top img{width:30px;height:30px;background:#fff;border-radius:50%;padding:2px}
  .top b{font-size:14.5px;flex:1}
  .top .av{background:var(--hd2);color:#fff;border:0;cursor:pointer;width:36px;height:36px}
  .wrap{padding:0 12px calc(112px + env(safe-area-inset-bottom))}
  .wrap>.ph:first-child{margin:0 -12px 14px;padding:10px 20px 24px;background:var(--hd);color:#fff;align-items:flex-start}
  .wrap>.ph:first-child p{color:var(--hdtx)}
  .wrap>.ph:first-child .btn-s,.wrap>.ph:first-child .btn-g{background:var(--hd2);color:#fff;border-color:transparent}
  .wrap>.ph:first-child .btn-p{background:#fff;color:var(--hd)}
  .wrap>.ph:first-child .in{background-color:var(--hd2);border-color:transparent;color:#fff}
  .wrap>.ph:first-child .in option{color:var(--ink)}
  .wrap>.ph:first-child .seg{background:var(--hd2)}
  .wrap>.ph:first-child .seg button{color:var(--hdtx)}
  .wrap>.ph:first-child .seg button.on{background:#fff;color:var(--hd)}
  .wrap>.ph:first-child .dates button{background:var(--hd2);color:#fff}
  .wrap>.ph:first-child .dates button.on{background:#fff;color:var(--hd)}
  .ph h1{font-size:23px}
  .ph .act{width:100%}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;justify-content:space-around;align-items:center;background:#fff;padding:9px 10px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--line),0 -8px 24px rgba(0,0,0,.04)}
  body{--nav:72px}
  .sticky{bottom:calc(84px + env(safe-area-inset-bottom))}
  .card{border-radius:18px}
  .card-h{padding:14px 15px}
  .card-b{padding:2px 15px 15px}
  .sg button{min-width:40px;height:40px}
  .pr .sg.teks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}
  .pr .sg.teks button{padding:0 4px}
}
@media(min-width:961px){.bnav{display:none}}
#cetak{display:none}
.ck-l{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px 10px;margin-top:8px}
.ck-l label{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.ck-l label:last-child{border-bottom:0}
.ck-l small{display:block;color:var(--ink3);font-size:12px}
@media print{
  @page{size:A4;margin:12mm 14mm}
  html,body{background:#fff!important}
  body>*:not(#cetak){display:none!important}
  #cetak{display:block;color:#1b1d19;font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cp{min-height:271mm;display:flex;flex-direction:column;break-after:page;page-break-after:always}
  .cp:last-child{break-after:auto;page-break-after:auto}
  .cp-kop{display:flex;align-items:center;gap:12px;padding-bottom:9px;border-bottom:1.5px solid #1b1d19}
  .cp-kop img{width:46px;height:46px}
  .cp-kop b{display:block;font-size:11pt;letter-spacing:.4px;white-space:nowrap}
  .cp-kop span{font-size:8.5pt;color:#55584f}
  .cp-kop .ar{margin-left:auto;font-family:"Scheherazade New",serif;font-size:15pt;white-space:nowrap}
  .cp-jd{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
  .cp-jd small{display:block;font-size:8pt;font-weight:700;letter-spacing:2px;color:#55584f}
  .cp-jd h2{margin:2px 0 0;font-size:17pt;letter-spacing:-.3px}
  .cp-jd div:last-child{font-size:13pt;font-weight:800;text-align:right}
  .cp-jd em{font-style:normal;font-weight:500;color:#55584f}
  .cp-id{display:grid;grid-template-columns:1fr 1fr;gap:5px 24px;margin-top:12px;font-size:9.5pt}
  .cp-id span{display:inline-block;width:90px;color:#55584f}
  .cp table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:12px;font-size:9pt}
  .cp thead{display:table-header-group}
  .cp tr{break-inside:avoid}
  .cp th{text-align:left;font-size:7.5pt;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#3e403b;padding:0 6px 5px;border-bottom:1.5px solid #1b1d19}
  .cp td{padding:3.5px 6px;border-bottom:1px solid #dedcd5;vertical-align:top;line-height:1.35}
  .cp td.n{font-weight:800;text-align:center}
  .cp td.t,.cp td.b,.cp td.r{color:#3e403b}
  .cp td.t{white-space:nowrap}
  .cp tr.sep td{background:#f2f1ed;color:#55584f;font-size:8pt;font-weight:600;padding:3px 6px}
  .cp-ttd{display:flex;justify-content:space-between;margin-top:auto;padding-top:18px;font-size:9.5pt;break-inside:avoid}
  .cp-ttd>div{width:62mm;display:flex;flex-direction:column}
  .cp-ttd i{height:52px}
  .cp-ttd b{border-top:1px solid #1b1d19;padding-top:4px}
  .cp-ft{display:flex;justify-content:space-between;font-size:7.5pt;color:#6a6d65;margin-top:10px}
}
.lembar{position:fixed;inset:0;z-index:95;background:rgba(20,22,19,.42);display:flex;align-items:flex-end;animation:fd .15s}
.lembar.tutup{opacity:0;transition:opacity .15s}
.lb-p{background:#fff;width:100%;max-height:78vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:naik .2s ease-out;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
@keyframes naik{from{transform:translateY(40px);opacity:.4}}
.lb-p:before{content:"";width:40px;height:4px;border-radius:4px;background:var(--line2);margin:9px auto 0;flex:none}
.lb-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px 8px 20px}
.lb-h b{font-size:16px}
.lb-h .x{color:var(--ink3)}.lb-h .x:hover{background:var(--soft);color:var(--ink)}
.lb-c{padding:0 16px 8px}
.lb-l{overflow:auto;padding:0 8px 12px;overscroll-behavior:contain}
.lb-g{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3);padding:12px 12px 4px}
.lb-o{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:50px;padding:12px;border:0;background:none;border-radius:12px;text-align:left;font-size:15px;color:var(--ink);cursor:pointer}
.lb-o span{min-width:0;overflow-wrap:anywhere}
.lb-o:active{background:var(--soft)}
.lb-o.on{background:var(--soft);font-weight:700}
.lb-o.on:after{content:"";flex:none;width:6px;height:12px;border-right:2.5px solid var(--hd);border-bottom:2.5px solid var(--hd);transform:rotate(45deg);margin:-4px 6px 0 0}
.lb-o:disabled{color:var(--ink3);cursor:default}
@media(max-width:640px){
  .dates input{flex:1 1 140px;min-width:0}
  .t[data-hp=tabel] .kx,.t[data-hp=tabel] tr.det>td:first-child{display:none}
  table[data-hp=ringkas],table[data-hp=form]{display:block;width:100%}
  table[data-hp=ringkas] thead,table[data-hp=form] thead{display:none}
  table[data-hp=ringkas] tbody,table[data-hp=form] tbody{display:block}
  table[data-hp=ringkas] tr,table[data-hp=form] tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:12px 15px;border-bottom:1px solid var(--line);position:relative}
  table[data-hp=ringkas] tr:last-child,table[data-hp=form] tr:last-child{border-bottom:0}
  table[data-hp] td{border:0}
  table[data-hp=ringkas] td,table[data-hp=form] td{display:block;padding:0;min-width:0;text-align:left;position:static;background:none;max-width:none;width:auto!important;white-space:normal!important}
  table[data-hp] td.ku{flex:0 1 auto;text-align:right}
  table[data-hp] td.ku1{flex:1 1 0;text-align:left;font-weight:600}
  table[data-hp] td.ks{flex-basis:100%;order:2;font-size:12.5px;color:var(--ink3)}
  table[data-hp] td.ks .chip{margin-top:2px}
  table[data-hp=ringkas] td.kx{display:none;order:3}
  table[data-hp=ringkas] tr.buka td.kx:not(.kk){display:flex;flex-basis:100%;align-items:baseline;gap:12px;font-size:13px;padding-top:6px;border-top:1px dashed var(--line);margin-top:2px}
  table[data-hp=ringkas] tr.buka td.kx:before{content:attr(data-l);color:var(--ink3);font-weight:600;flex:0 0 32%}
  table[data-hp=ringkas] td.kx .kv{flex:1;min-width:0;overflow-wrap:anywhere}
  table[data-hp=ringkas] td.kx .kv .btn{margin:0 6px 4px 0}
  table[data-hp=ringkas] tr.buka td.kx .sub{display:block}
  table[data-hp=ringkas] tr.ada-x,table[data-hp=ringkas] tr.click{padding-right:38px;cursor:pointer}
  table[data-hp=ringkas] tr.ada-x:after,table[data-hp=ringkas] tr.click:after{content:"";position:absolute;right:17px;top:21px;width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);transition:transform .15s}
  table[data-hp=ringkas] tr.click:after{transform:rotate(-45deg)}
  table[data-hp=ringkas] tr.buka:after{transform:rotate(225deg);top:25px}
  table[data-hp=ringkas] tr.buka{background:#faf9f6}
  table[data-hp=form] tr:after{content:"";flex-basis:100%;order:1}
  table[data-hp=form] td.kf{flex:1 1 150px;display:flex;flex-direction:column;gap:4px;order:2}
  table[data-hp=form] td.kf:before{content:attr(data-l);font-size:11.5px;font-weight:700;color:var(--ink3)}
  table[data-hp=form] td.kf .in{width:100%}
  .mx[data-hp=ringkas] td{font-size:13px}
  .mx[data-hp=ringkas] td.k-A:before,.mx[data-hp=ringkas] td.k-S:before{color:var(--ink3)}
}
.bnav a{display:flex;align-items:center;gap:7px;height:44px;padding:0 13px;border-radius:99px;color:var(--ink3);font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;border:0;background:none}
.bnav a svg{width:21px;height:21px;flex:none}
.bnav a span{display:none}
.bnav a.on{background:var(--hd);color:#fff}
.bnav a.on span{display:inline}
.prog{margin-top:16px;max-width:420px}
.prog .bt{display:flex;gap:4px}
.prog .bt i{flex:1;height:5px;border-radius:9px;background:var(--line2)}
.prog .bt i.f{background:var(--emas)}
.prog .lb{display:flex;justify-content:space-between;font-size:12px;margin-top:7px;color:var(--ink3)}
@media(max-width:960px){.ph .prog .bt i{background:var(--hd2)}.ph .prog .bt i.f{background:var(--emas)}.ph .prog .lb{color:var(--hdtx)}}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.temas label{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.temas label:has(input:checked),.temas label.on{border-color:var(--ink)}
.temas input{position:absolute;opacity:0;pointer-events:none}
.temas .sw{display:flex}
.temas .sw i{width:22px;height:22px;border-radius:50%;margin-right:-6px;box-shadow:0 0 0 2px #fff}
.temas b{display:block;font-size:13.5px}
.temas small{color:var(--ink3);font-size:12px}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px}
.card-h p{margin:2px 0 0;color:var(--ink3);font-size:12.5px}
.card-b{padding:4px 16px 16px}
.tw{overflow:auto}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:11.5px;font-weight:700;color:var(--ink3);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:#faf9f6}
.t .sub{display:block;color:var(--ink3);font-size:12.5px}
.t td.n{width:40px;color:var(--ink3);font-variant-numeric:tabular-nums}
.t td.r,.t th.r{text-align:right}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;border:0;color:var(--ink2);white-space:nowrap;margin:1px 3px 1px 0;background:var(--soft)}
.chip.acc{background:transparent;color:var(--good);padding-left:2px}.chip.acc:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px}
.chip.warn{background:var(--tint);color:var(--tinttx)}
.chip.bad{background:#f7e4e1;color:var(--bad)}
.empty{padding:34px 16px;text-align:center;color:var(--ink3)}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:0 16px 12px}
.bar .in{width:auto}
.search{flex:1;min-width:180px}

function api(action, data) {
  if (!API || API.indexOf('TEMPEL') === 0) return Promise.reject(new Error('Alamat server belum diatur di config.js.'));
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, token: S.token, data: data || {} }) })
    .then(function (r) { return r.json(); })
    .catch(function () { throw new Error('Tidak bisa menghubungi server. Periksa koneksi internet.'); })
    .then(function (j) {
      if (!j.ok) {
        if (j.relogin) { S.token = ''; localStorage.removeItem('jm_token'); setTimeout(tampilLogin, 50); }
        var e = new Error(j.error || 'Terjadi kesalahan.');
        if (/^Perintah tidak dikenal/.test(e.message)) { e = new Error(admin() ? 'Server Apps Script belum diperbarui ke versi terbaru.' : 'Fitur ini belum aktif karena server aplikasi belum diperbarui. Hubungi admin.'); e.serverLama = true; }
        throw e;
      }
      return j.data;
    });
}

function sibuk(btn, p) {
  if (!btn) return p;
  var isi = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spin" style="width:15px;height:15px;margin:0;border-width:2px"></span>';
  return p.then(function (x) { btn.disabled = false; btn.innerHTML = isi; return x; },
    function (e) { btn.disabled = false; btn.innerHTML = isi; throw e; });
}

function pekanEf(p) {
  if (!p || !p.mulai || !p.selesai) return [];
  var t = function (s) { var a = s.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); };
  var iso = function (d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  var mulai = t(p.mulai), selesai = t(p.selesai), lb = (p.libur || []).map(function (l) { return { a: t(l.mulai), b: t(l.selesai || l.mulai), k: l.ket || '' }; });
  var w = new Date(mulai.getTime()); w.setDate(w.getDate() - ((w.getDay() + 6) % 7));
  var out = [], ke = 0;
  for (; w <= selesai; w.setDate(w.getDate() + 7)) {
    var ak = 0, kt = {};
    for (var i = 0; i < 6; i++) {
      var d = new Date(w.getTime()); d.setDate(d.getDate() + i);
      if (d < mulai || d > selesai) continue;
      var l = lb.filter(function (x) { return d >= x.a && d <= x.b; })[0];
      if (l) { if (l.k) kt[l.k] = 1; } else ak++;
    }
    var e = new Date(w.getTime()); e.setDate(e.getDate() + 6);
    if (ak) ke++;
    out.push({ ke: ak ? ke : 0, mulai: iso(w), selesai: iso(e), hariKBM: ak, efektif: ak > 0, ket: Object.keys(kt).join(', ') });
  }
  return out;
}

var PEMANTAU = ['admin', 'mudir', 'kadiv', 'kabidDiniyah'];
var BL = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
var HR3 = ['', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Ahad'];
var KODE_LABEL = { H: 'Hadir', S: 'Sakit', I: 'Izin', A: 'Alpa', T: 'Tanpa keterangan', SM: 'Sakit (menunggu UKS)', M: 'Menunggu konfirmasi' };
var REKOM = { istirahat: 'Istirahat, tidak ikut KBM', ikut: 'Boleh ikut KBM', rujuk: 'Dirujuk / dipulangkan' };
var STATUS_P = [['hadir', 'Hadir'], ['telat', 'Telat'], ['badal', 'Badal'], ['ghaib', 'Ghaib']];

function pemantau() { return PEMANTAU.some(punya); }
function hakPenuh() { return punya('admin') || punya('kabidDiniyah'); }
function tglD(iso) { var a = iso.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }
function isoD(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function tambahHari(iso, n) { var d = tglD(iso); d.setDate(d.getDate() + n); return isoD(d); }
function hariKe(iso) { return ((tglD(iso).getDay() + 6) % 7) + 1; }
function tglPendek(iso) { var a = iso.split('-'); return HR3[hariKe(iso)] + ' ' + (+a[2]) + ' ' + BL[+a[1] - 1]; }
function tglPanjang(iso) { return HARI[hariKe(iso)] + ', ' + fmtTgl(iso); }
function hariKini() { return S.b.hariIni || hariIni(); }
function nmK(id) { return ((D().K[id] || {}).nama || id).replace(/^(SMP|SMA)\s+/, ''); }
function nmM(id) { return (D().Mp[id] || {}).nama || id; }
function nmS(id) { var s = D().SN[id]; return s ? s.nama : id; }
function kelasSantri(id) { var s = S.b.struktur; var p = s ? s.penempatan.filter(function (x) { return x.santriId === id; })[0] : null; return p ? nmK(p.kelasId) : ''; }
function santriDiKelas(kid) {
  var d = D(), s = S.b.struktur;
  return (s ? s.penempatan : []).filter(function (p) { return p.kelasId === kid && d.SN[p.santriId] && d.SN[p.santriId].status === 'aktif'; })
    .map(function (p) { return p.santriId; }).sort(function (a, b) { return nmS(a).localeCompare(nmS(b)); });
}
function tglKBM(iso) {
  var p = D().P[S.b.periodeAktifId];
  if (!p || !p.mulai || iso < p.mulai || iso > p.selesai || hariKe(iso) === 7) return false;
  return !(p.libur || []).some(function (l) { return iso >= l.mulai && iso <= (l.selesai || l.mulai); });
}
function jendelaTgl() {
  var t = hariKini(), b = parseInt(S.b.pengaturan.batasSusulanHari, 10) || 0, out = [];
  for (var i = 0; i <= b; i++) { var x = tambahHari(t, -i); if (tglKBM(x)) out.push(x); }
  return out;
}
function ambilHari(t) {
  return api('hari', { tanggal: t || hariKini() }).then(function (h) { S.b.hariIni = h.hariIni; S.b.jam = h.jam; return h; });
}
function cariJ(h, id) { return h.jurnal.filter(function (j) { return j.id === id; })[0] || null; }
function cariPP(h, id) { return h.pengajar.filter(function (p) { return p.id === id; })[0] || null; }
function badalSaya(h, b) { var p = cariPP(h, b.id); return !!p && p.status === 'badal' && p.badalId === S.b.me.id; }
function sudahMulai(b, h) { return b.tanggal < h.hariIni || (b.tanggal === h.hariIni && b.mulai <= h.jam); }
function blokSaya(h) { return h.blok.filter(function (b) { return b.ustadzId === S.b.me.id || badalSaya(h, b); }); }
function chip(t, k) { return '<span class="chip' + (k ? ' ' + k : '') + '">' + t + '</span>'; }

function statusBlok(b, h) {
  var j = cariJ(h, b.id), pp = cariPP(h, b.id), x = '';
  if (j && j.status === 'tidak') x = chip('Tidak hadir · ' + esc(j.alasan), 'bad');
  else if (j) { var n = Object.keys(j.absen || {}).length; x = chip('Terisi', 'acc') + (n ? chip(n + ' tidak hadir') : ''); }
  else x = sudahMulai(b, h) ? chip('Belum diisi', 'warn') : chip('Belum mulai');
  if (pp && pp.status === 'badal') x += chip('Badal: ' + esc(namaU(pp.badalId)));
  return x;
}
function barisBlok(b, h, opsi) {
  opsi = opsi || {};
  return '<div class="blk" data-b="' + esc(b.id) + '"><time>' + (opsi.tgl ? tglPendek(b.tanggal) + ' · ' : '') + b.mulai + '–' + b.selesai + '</time><div><b>' + esc(nmM(b.mapelId)) + '</b><span class="s">' + esc(nmK(b.kelasId)) +

  $('#bBatal').onclick = function () { gambarPiket(v, h); };
  $('#bSimpan').onclick = function () {
    var rows = Object.keys(ubah).map(function (id) { var b = h.blok.filter(function (x) { return x.id === id; })[0]; var y = ubah[id]; return { kelasId: b.kelasId, mulai: b.mulai, status: y.status, badalId: y.badalId, ket: y.ket }; });
    sibuk(this, api('simpanPresensiPengajar', { tanggal: h.tanggal, rows: rows })).then(function () { toast('Kehadiran pengajar tersimpan.'); render(); }, function (e) { toast(e.message, 1); });
  };
  kartuSantriHari($('#sH'), h, punya('piket') || punya('admin') || punya('uks') || punya('kesantrian'));
}

function kartuSantriHari(el, h, bolehKonf) {
  var antre = h.santriHari.filter(function (x) { return x.status === 'M'; });
  var lain = h.santriHari.filter(function (x) { return x.status !== 'M'; }).sort(function (a, b) { return a.status < b.status ? -1 : a.status > b.status ? 1 : nmS(a.santriId).localeCompare(nmS(b.santriId)); });
  var kf = idx(h.konfirmasi.map(function (k) { return { id: k.santriId, s: k.status, oleh: k.oleh }; }));
  var html = '';
  if (h.modeSakit === 'uks' || antre.length) html += '<div class="card"><div class="card-h"><div><h3>Perlu konfirmasi</h3><p>Ditandai tanpa keterangan atau sakit tanpa catatan UKS. Bila tidak dikonfirmasi sampai akhir hari, tercatat alpa.</p></div></div><div class="card-b">' +
    (antre.length ? '<ul class="lst">' + antre.map(function (x) {
      return '<li data-s="' + x.santriId + '"><div class="f1"><b>' + esc(nmS(x.santriId)) + '</b><span>' + esc(kelasSantri(x.santriId)) + ' · ditandai di ' + x.blok + ' jam</span></div>' +
        (bolehKonf && h.tanggal <= h.hariIni ? '<div class="sg teks">' + [['S', 'Sakit'], ['I', 'Izin'], ['A', 'Alpa']].map(function (k) { return '<button type="button" data-k="' + k[0] + '">' + k[1] + '</button>'; }).join('') + '</div>' : chip('Menunggu', 'warn')) + '</li>';
    }).join('') + '</ul>' : '<p class="muted" style="margin:4px 0">Tidak ada antrean.</p>') + '</div></div>';
  html += '<div class="card"><div class="card-h"><div><h3>Santri tidak hadir</h3><p>' + tglPanjang(h.tanggal) + ' · dari jurnal KBM dan catatan UKS.</p></div></div><div class="card-b">' +
    (lain.length ? '<ul class="lst">' + lain.map(function (x) {
      return '<li><div class="f1"><b>' + esc(nmS(x.santriId)) + '</b><span>' + esc(kelasSantri(x.santriId)) + (x.blok ? ' · ' + x.blok + ' jam' : '') + (x.uks ? ' · catatan UKS' : '') + (kf[x.santriId] ? ' · dikonfirmasi ' + esc(namaU(kf[x.santriId].oleh)) : '') + '</span></div>' +
        chip(KODE_LABEL[x.status], x.status === 'A' ? 'bad' : x.status === 'S' ? 'warn' : '') + '</li>';
    }).join('') + '</ul>' : '<p class="muted" style="margin:4px 0">Semua santri hadir' + (h.jurnal.length ? '' : ' (belum ada jurnal)') + '.</p>') + '</div></div>';
  el.innerHTML = html;
  $$('li[data-s] .sg button', el).forEach(function (bt) {
    bt.onclick = function () {
      var s = bt.closest('li').dataset.s;
      sibuk(bt, api('konfirmasiSantri', { tanggal: h.tanggal, rows: [{ santriId: s, status: bt.dataset.k }] })).then(function () { toast(nmS(s) + ': ' + KODE_LABEL[bt.dataset.k].toLowerCase() + '.'); render(); }, function (e) { toast(e.message, 1); });
    };
  });
}

HAL.uks = function (v) {
  if (!S.b.periodeAktifId) { v.innerHTML = head('UKS') + '<div class="card"><div class="empty">Belum ada semester aktif.</div></div>'; return; }
  S.ut = S.ut || hariKini();
  return ambilHari(S.ut).then(function (h) {
    var edit = punya('uks') || punya('kesantrian');
    var rows = h.uks.slice().sort(function (a, b) { return a.mulai < b.mulai ? 1 : -1; });
    v.innerHTML = head('UKS', 'Santri sakit pada ' + tglPanjang(h.tanggal) + '. Catatan dengan rekomendasi istirahat atau dirujuk otomatis menjadi sakit di presensi.',
      edit ? '<button class="btn btn-p" id="bCatat">' + ic('plus') + 'Catat santri sakit</button>' : '') +
      '<div class="dates" id="dates">' + [0, 1, 2, 3, 4, 5, 6].map(function (i) { var t = tambahHari(hariKini(), -i); return '<button data-t="' + t + '" class="' + (t === h.tanggal ? 'on' : '') + '">' + (i ? tglPendek(t) : 'Hari ini') + '</button>'; }).join('') + '<input type="date" class="in sm" id="tglLain"></div>' +
      '<div class="card"><div class="card-h"><div><h3>Catatan UKS</h3><p>' + rows.length + ' santri</p></div></div>' +
      (rows.length ? '<div class="tw"><table class="t" data-hp="ringkas" data-u="0,2"><thead><tr><th>Santri</th><th>Keluhan</th><th>Rekomendasi</th><th>Rentang</th></tr></thead><tbody>' + rows.map(function (u) {
        return '<tr class="' + (edit ? 'click' : '') + '" data-u="' + u.id + '"><td><b>' + esc(nmS(u.santriId)) + '</b><span class="sub">' + esc(kelasSantri(u.santriId)) + '</span></td><td>' + (u.terbatas ? '<span class="muted">Terbatas</span>' : esc(u.keluhan) + (u.catatan ? '<span class="sub">' + esc(u.catatan) + '</span>' : '')) + '</td>' +
          '<td>' + chip(esc(REKOM[u.rekomendasi] || u.rekomendasi), u.rekomendasi === 'ikut' ? '' : 'warn') + '</td><td style="white-space:nowrap">' + tglPendek(u.mulai) + (u.selesai && u.selesai !== u.mulai ? ' – ' + tglPendek(u.selesai) : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="empty">Tidak ada santri dalam catatan UKS pada tanggal ini.</div>') + '</div><div id="sH"></div>';
    ikatTanggal(function (t) { S.ut = t; render(); });
    var bc = $('#bCatat'); if (bc) bc.onclick = function () { formUks({ mulai: hariKini(), selesai: hariKini(), rekomendasi: 'istirahat' }); };
    if (edit) $$('tr[data-u]', v).forEach(function (tr) { tr.onclick = function () { formUks(rows.filter(function (u) { return u.id === tr.dataset.u; })[0]); }; });
    kartuSantriHari($('#sH'), h, punya('uks') || punya('kesantrian') || punya('piket') || punya('admin'));
  });
};
function formUks(u) {
  var sid = u.santriId || '';
  var aktif = S.b.santri.filter(function (s) { return s.status === 'aktif'; });
  modal({ judul: u.id ? 'Ubah catatan UKS' : 'Catat santri sakit', ok: 'Simpan',
    isi: fld('Santri', '<div id="sPil"></div>') +
      fld('Keluhan', '<textarea class="in" name="keluhan" rows="2" placeholder="mis. demam, pusing">' + esc(u.keluhan || '') + '</textarea>', 'Hanya terlihat oleh UKS, Kepala Kesantrian, wali kelas, dan Mudir.') +
      fld('Rekomendasi', '<div>' + Object.keys(REKOM).map(function (k) { return '<label class="chk"><input type="radio" name="rekomendasi" value="' + k + '"' + (u.rekomendasi === k ? ' checked' : '') + ' style="accent-color:var(--acc)"> ' + REKOM[k] + '</label>'; }).join('') + '</div>') +
      '<div class="g2">' + fld('Mulai', '<input class="in" type="date" name="mulai" value="' + esc(u.mulai || '') + '">') + fld('Sampai', '<input class="in" type="date" name="selesai" value="' + esc(u.selesai || u.mulai || '') + '">', 'Ubah bila diperkirakan lebih dari sehari.') + '</div>' +
      fld('Catatan', inp('catatan', u.catatan || '', 'placeholder="obat, tindakan (opsional)"')),
    kiri: u.id ? '<button class="btn btn-g kiri" id="bSembuh">Sudah sembuh</button><button class="btn btn-d" id="bHapus">' + ic('trash') + '</button>' : '',
    siap: function (ov, tutup) {
      var gambarPil = function () {
        var box = $('#sPil', ov);
        if (sid) { box.innerHTML = '<div class="dipilih"><span><b>' + esc(nmS(sid)) + '</b> <span class="muted">' + esc(kelasSantri(sid)) + '</span></span>' + (u.id ? '' : '<button type="button" class="btn btn-g btn-sm" id="gantiS">Ganti</button>') + '</div>'; var g = $('#gantiS', ov); if (g) g.onclick = function () { sid = ''; gambarPil(); }; return; }
        box.innerHTML = '<input class="in" id="cariS" placeholder="Ketik nama santri" autocomplete="off"><div class="pick" id="hasilS"></div>';
        var cari = $('#cariS', ov), hs = $('#hasilS', ov);
        var isi = function () {
          var q = cari.value.trim().toLowerCase();
          var r = aktif.filter(function (s) { return !q || (s.nama + ' ' + (s.panggilan || '')).toLowerCase().indexOf(q) >= 0; }).slice(0, 8);
          hs.innerHTML = r.map(function (s) { return '<div data-s="' + s.id + '">' + esc(s.nama) + '<span>' + esc(kelasSantri(s.id)) + '</span></div>'; }).join('') || '<div class="muted">Tidak ditemukan</div>';
          $$('[data-s]', hs).forEach(function (x) { x.onclick = function () { sid = x.dataset.s; gambarPil(); }; });
        };
        cari.oninput = isi; isi();
        setTimeout(function () { cari.focus(); }, 30);
      };
      gambarPil();
      var bs = $('#bSembuh', ov);
      if (bs) bs.onclick = function () {
        var t = hariKini(), x = Object.assign({}, u, { selesai: t < u.mulai ? u.mulai : t });
        sibuk(bs, api('simpanUks', x)).then(function () { tutup(); toast('Ditandai sembuh per ' + fmtTgl(x.selesai) + '.'); render(); }, function (e) { toast(e.message, 1); });
      };
      var bh = $('#bHapus', ov);
      if (bh) bh.onclick = function () { sibuk(bh, api('hapusUks', { id: u.id })).then(function () { tutup(); toast('Catatan dihapus.'); render(); }, function (e) { toast(e.message, 1); }); };
    },
    onOk: function (ov) {
      var x = nilai(ov); x.id = u.id; x.santriId = sid; x.rekomendasi = ($('[name=rekomendasi]:checked', ov) || {}).value || '';
      if (!sid) throw new Error('Pilih santri.');
      return api('simpanUks', x).then(function () { toast('Catatan UKS tersimpan.'); render(); });
    } });
}

HAL.rekap = function (v) {
  if (!S.b.struktur) { v.innerHTML = head('Rekap Presensi') + '<div class="card"><div class="empty">Belum ada semester aktif.</div></div>'; return; }
  var semuaK = pemantau() || punya('kesantrian');
  var ks = kelasUrut().filter(function (k) { return semuaK || S.b.me.konteks.wali.indexOf(k.id) >= 0; });
  if (!ks.length) { v.innerHTML = head('Rekap Presensi') + '<div class="card"><div class="empty">Anda belum menjadi wali kelas di semester aktif.</div></div>'; return; }
  if (!ks.some(function (k) { return k.id === S.rkK; })) S.rkK = ks[0].id;
  S.rkR = S.rkR || 'bulan'; S.rkV = S.rkV || 'ringkas';
  var p = D().P[S.b.periodeAktifId], kini = hariKini();
  var dari = '', sampai = '';
  if (S.rkR === 'bulan') { dari = kini.slice(0, 8) + '01'; sampai = kini; if (p.mulai > dari) dari = p.mulai; }
  else if (S.rkR === 'pekan') { dari = tambahHari(kini, -(hariKe(kini) - 1)); sampai = kini; }
  else if (S.rkR === 'atur') { dari = S.rkD || p.mulai; sampai = S.rkS || kini; }
  return api('rekapPresensi', { kelasId: S.rkK, dari: dari, sampai: sampai }).then(function (r) {
    var html = head('Rekap Presensi', 'Presensi diniyah dalam satuan hari. Alpa di salah satu jam pelajaran dihitung alpa untuk hari itu.',
      '<select class="in sm" id="rkK" style="width:auto">' + opsi(ks, S.rkK, function (k) { return k.nama; }) + '</select>') +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px"><div class="seg" id="rkR">' + [['pekan', 'Pekan ini'], ['bulan', 'Bulan ini'], ['semester', 'Semester'], ['atur', 'Atur tanggal']].map(function (x) { return '<button data-r="' + x[0] + '" class="' + (S.rkR === x[0] ? 'on' : '') + '">' + x[1] + '</button>'; }).join('') + '</div>' +
      (S.rkR === 'atur' ? '<input type="date" class="in sm" id="rkD" style="width:auto" value="' + r.dari + '"><span class="muted">–</span><input type="date" class="in sm" id="rkS" style="width:auto" value="' + r.sampai + '">' : '') +
      '<div class="seg" id="rkV" style="margin-left:auto"><button data-v="ringkas" class="' + (S.rkV === 'ringkas' ? 'on' : '') + '">Ringkas</button><button data-v="tanggal" class="' + (S.rkV === 'tanggal' ? 'on' : '') + '">Per tanggal</button></div></div>';
    var n = r.tanggal.length, adaM = r.santri.some(function (x) { return x.M; });
    var urut = r.santri.slice().sort(function (a, b) { return nmS(a.santriId).localeCompare(nmS(b.santriId)); });
    html += '<div class="card"><div class="card-h"><div><h3>' + esc((D().K[r.kelasId] || {}).nama) + '</h3><p>' + fmtTgl(r.dari) + ' – ' + fmtTgl(r.sampai) + ' · ' + n + ' hari KBM terjurnal</p></div><button class="btn btn-s btn-sm" id="bSalinR">' + ic('copy') + 'Salin ke Excel</button></div>';
    if (!n) html += '<div class="empty">Belum ada jurnal KBM pada rentang ini.</div>';
    else if (S.rkV === 'ringkas') html += '<div class="tw"><table class="t" data-hp="tabel" data-u="1,2,3,4,5,6"><thead><tr><th>#</th><th>Santri</th><th class="r">Hadir</th><th class="r">Sakit</th><th class="r">Izin</th><th class="r">Alpa</th>' + (adaM ? '<th class="r">Menunggu</th>' : '') + '</tr></thead><tbody>' +
      urut.map(function (x, i) {
        var tdk = Object.keys(x.hari).sort();
        return '<tr class="' + (tdk.length ? 'click' : '') + '" data-s="' + x.santriId + '"><td class="n">' + (i + 1) + '</td><td><b>' + esc(nmS(x.santriId)) + '</b></td><td class="r">' + (n - x.S - x.I - x.A - x.M) + '</td><td class="r' + (x.S ? ' warn' : ' muted') + '">' + x.S + '</td><td class="r' + (x.I ? '' : ' muted') + '">' + x.I + '</td><td class="r' + (x.A ? ' bad' : ' muted') + '">' + x.A + '</td>' + (adaM ? '<td class="r muted">' + x.M + '</td>' : '') + '</tr>' +
          (tdk.length ? '<tr class="det hide" data-d="' + x.santriId + '"><td></td><td colspan="' + (adaM ? 6 : 5) + '">' + tdk.map(function (t) { return tglPendek(t) + ': ' + KODE_LABEL[x.hari[t]].toLowerCase(); }).join(' · ') + '</td></tr>' : '');
      }).join('') + '</tbody></table></div>';
    else html += '<div class="tw"><table class="mx" data-hp="ringkas" data-u="0" data-kosong="1"><thead><tr><th class="nm">Santri</th>' + r.tanggal.map(function (t) { var a = t.split('-'); return '<th>' + HR3[hariKe(t)].slice(0, 1) + '<br>' + (+a[2]) + '/' + (+a[1]) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      urut.map(function (x) { return '<tr><td class="nm">' + esc(nmS(x.santriId)) + '</td>' + r.tanggal.map(function (t) { var k = x.hari[t]; return '<td class="' + (k ? 'k-' + k : 'muted') + '">' + (k ? (k === 'M' ? '?' : k) : '·') + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    html += '</div>';
    v.innerHTML = html;
    $('#rkK').onchange = function () { S.rkK = this.value; render(); };
    $$('#rkR button').forEach(function (b) { b.onclick = function () { S.rkR = b.dataset.r; render(); }; });
    $$('#rkV button').forEach(function (b) { b.onclick = function () { S.rkV = b.dataset.v; render(); }; });
    ['rkD', 'rkS'].forEach(function (k) { var el = $('#' + k); if (el) el.onchange = function () { S[k] = el.value; render(); }; });
    $$('tr.click[data-s]', v).forEach(function (tr) { tr.onclick = function () { var d = $('tr[data-d="' + tr.dataset.s + '"]'); if (d) d.classList.toggle('hide'); }; });
    $('#bSalinR').onclick = function () {
      var tsv = ['No\tNama\tHadir\tSakit\tIzin\tAlpa' + r.tanggal.map(function (t) { return '\t' + t; }).join('')].concat(urut.map(function (x, i) {
        return (i + 1) + '\t' + nmS(x.santriId) + '\t' + (n - x.S - x.I - x.A - x.M) + '\t' + x.S + '\t' + x.I + '\t' + x.A + r.tanggal.map(function (t) { return '\t' + (x.hari[t] || ''); }).join('');
      })).join('\n');
      var ok2 = function () { toast('Rekap disalin. Tempel di Excel atau Google Sheet.'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tsv).then(ok2, function () { modal({ judul: 'Salin rekap', isi: '<textarea class="in" rows="10">' + esc(tsv) + '</textarea>' }); });
      else modal({ judul: 'Salin rekap', isi: '<textarea class="in" rows="10">' + esc(tsv) + '</textarea>' });
    };
  });
};

if (S.token) {
  api('boot').then(function (b) { S.b = b; S.per = b.periodeAktifId || ((b.periode[b.periode.length - 1] || {}).id || ''); mulai(); }, function () { tampilLogin(); });
} else tampilLogin();
</script>
</body>
</html>
